name: Feature request
description: Propose a new capability that doesn't exist in dtgraph yet.
title: "[Feature]: "
labels:
  - feature
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What's missing, and why does it matter? What can't you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What should dtgraph do? Be specific enough that someone could implement this
        without asking you follow-up questions — e.g. CLI flags, API shape, expected
        output, edge cases (composite tokens, aliases across files, cycles).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you didn't pick them.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links to prior art, related DTCG spec sections, or related issues.
    validations:
      required: false
