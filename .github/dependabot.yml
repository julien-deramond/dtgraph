version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/*'
      - '/apps/*'
      - '/examples/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # TypeScript 7's native compiler doesn't yet expose the programmatic API
      # that @astrojs/language-server needs for `astro check`.
      # See https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']
      # sigma 4 rewrites the rendering API @dtgraph/viewer is built on (programs,
      # canvas label drawers, Camera#animatedReset). The viewer moves to sigma 4 in
      # its own PR, which removes this entry.
      - dependency-name: 'sigma'
        versions: ['>=4.0.0']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      github-actions:
        patterns:
          - '*'
