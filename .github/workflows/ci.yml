name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Build before typecheck: a package's declaration output (e.g. @dtgraph/core's dist/*.d.ts)
      # is how its workspace dependents (e.g. packages/cli) resolve its types, and pnpm's
      # topological build order only guarantees core builds before cli — not that core is built
      # before cli is *typechecked*, since typecheck is a separate, non-topologically-linked step.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
