# pnpm workspace configuration.
# This monorepo is pnpm-only. Install with `pnpm install` at the repo root.
packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'
allowBuilds:
  esbuild: true
overrides:
  '@astrojs/compiler-rs': 0.4.0
minimumReleaseAgeExclude:
  - '@csstools/css-syntax-patches-for-csstree@1.1.14'
  - brace-expansion@5.0.12
  - electron-to-chromium@1.5.428
  - fast-uri@3.1.8
  - magic-string@1.4.1
  - '@deramond.dev/astro@0.1.3 || 0.2.0 || 0.2.1 || 0.3.1 || 0.5.0'
  - '@deramond.dev/tokens@0.1.0 || 0.1.1'
  - satori@0.33.5
  - '@deramond.dev/storybook@0.1.0'
